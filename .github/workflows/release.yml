name: Release Guest Artifacts

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish-guest-artifacts:
    name: Build and publish the SP1 ASM guest ELF and vk files
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the release (if missing) and upload assets via the GitHub Releases API
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          RUST_TOOLCHAIN="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install SP1 toolchain
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - name: Check SP1 toolchain
        run: cargo prove --version

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build guest ELF and vk files
        # The guest build and vk derivation are both opt-in (see the crate's build.rs).
        env:
          BUILD_ELF: "1"
          BUILD_VKEY: "1"
        run: cargo build --locked -p strata-asm-sp1-guest-builder --features docker-build

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          GEN_DIR=guest-builder/sp1/generated
          cp "$GEN_DIR/asm.elf" "$GEN_DIR/asm-predicate.txt" "$GEN_DIR/asm-vkey-hash.txt" dist/
          (cd dist && sha256sum asm.elf asm-predicate.txt asm-vkey-hash.txt > SHA256SUMS)
          ls -la dist/

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # All expected assets must exist locally before any upload — failing here keeps
          # us from publishing a partial release if a prior step silently produced nothing.
          assets=(dist/asm.elf dist/asm-predicate.txt dist/asm-vkey-hash.txt dist/SHA256SUMS)
          for f in "${assets[@]}"; do
            [ -f "$f" ] || { echo "::error::missing artifact: $f"; exit 1; }
          done
          # Create the release as a draft so the assets can be attached, then publish.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $TAG is already published; assets cannot be attached to an immutable release"
              exit 1
            fi
          else
            prerelease_flag=""
            case "$TAG" in *-*) prerelease_flag="--prerelease" ;; esac
            # The vkey hash goes in the notes too, so it can be read without downloading anything.
            gh release create "$TAG" --draft $prerelease_flag --title "$TAG" --generate-notes \
              --notes "Program vkey hash: \`$(cat dist/asm-vkey-hash.txt)\`"
          fi
          gh release upload "$TAG" --clobber "${assets[@]}"
          gh release edit "$TAG" --draft=false
