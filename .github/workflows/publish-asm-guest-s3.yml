name: Publish ASM Guest to S3

# Republishes the ASM guest assets of a GitHub Release (asm.elf,
# asm-predicate.txt, asm-vkey-hash.txt, SHA256SUMS) to S3. It never builds:
# the release is the one build, and this copies those exact bytes after
# checking them against SHA256SUMS.
#
# Called as the last job of release.yml. `on: release` is not used because
# release.yml creates the release with GITHUB_TOKEN, and events made with that
# token do not start other workflows.
#
# The baremetal-binaries environment needs a reviewer's approval, and this job
# only runs from v* tags. To retry, re-run the failed job; to backfill, dispatch
# with a v* tag selected as the ref (any tag that has this workflow) and the
# target tag as input. Only releases cut after #295 carry guest assets.
#
# The ELF depends only on the source commit, so objects are keyed by it:
#   s3://alpen-mosaic-artifacts/elfs/asm-runner/<commit>/
#     asm.elf  asm-predicate.txt  asm-vkey-hash.txt  (+ a .sha256 sidecar each)
#     SHA256SUMS  manifest.json
# manifest.json is written last and marks a completed publish. A rerun with the
# same digests (e.g. an rc and its final release on one commit) is a no-op,
# different digests fail, and objects without a manifest are re-uploaded.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose assets to publish.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose assets to publish (e.g. v0.4.0-rc.8).
        required: true
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  S3_BUCKET: alpen-mosaic-artifacts
  S3_PREFIX: elfs/asm-runner

# One global group: tags on the same commit share an S3 prefix, and the commit
# isn't known until the job runs. Publishes are rare and take about a minute.
concurrency:
  group: publish-asm-guest-s3
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish ASM guest release assets to S3
    # Only release tags may publish; belt-and-suspenders with the environment's
    # deployment-ref policy.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: baremetal-binaries
    permissions:
      contents: read # download release assets
      id-token: write # assume the artifacts S3 role via OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag input
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/guest_publish.py validate

      - name: Fetch and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          OUTPUT_DIR: ${{ runner.temp }}/asm-guest
        run: python3 .github/scripts/guest_publish.py fetch

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::496607027995:role/github-actions-asm-binary-s3
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        env:
          OUTPUT_DIR: ${{ runner.temp }}/asm-guest
        run: python3 .github/scripts/guest_publish.py upload
