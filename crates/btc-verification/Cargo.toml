[package]
name = "strata-btc-verification"
version = "0.1.0"
edition = "2024"

[dependencies]
strata-btc-types.workspace = true
strata-crypto.workspace = true
strata-identifiers.workspace = true

arbitrary.workspace = true
bitcoin.workspace = true
borsh.workspace = true
serde.workspace = true
thiserror.workspace = true

ssz.workspace = true
ssz_derive.workspace = true
ssz_primitives = { workspace = true, optional = true }
ssz_types = { workspace = true, optional = true }
tree_hash = { workspace = true, optional = true }
tree_hash_derive = { workspace = true, optional = true }

[build-dependencies]
ssz_codegen = { workspace = true, optional = true }

[features]
ssz = [
  "dep:ssz_primitives",
  "dep:ssz_types",
  "dep:tree_hash",
  "dep:tree_hash_derive",
  "dep:ssz_codegen",
]

[dev-dependencies]
strata-test-utils-btc.workspace = true

rand.workspace = true

[lints]
workspace = true
