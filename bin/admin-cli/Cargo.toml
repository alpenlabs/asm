[package]
name = "strata-asm-admin-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "asm-admin"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
strata-asm-admin-threshold-sig.workspace = true
strata-asm-admin-types.workspace = true
strata-asm-bridge-types.workspace = true
strata-asm-common.workspace = true
strata-asm-params.workspace = true
strata-asm-proto-admin-txs.workspace = true
strata-crypto.workspace = true
strata-l1-txfmt.workspace = true
strata-predicate.workspace = true
strata-test-utils-btcio.workspace = true

anyhow.workspace = true
bitcoin = { workspace = true, features = ["base64"] }
bitcoind-async-client = { workspace = true, features = ["raw_rpc"] }
clap.workspace = true
hex.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
